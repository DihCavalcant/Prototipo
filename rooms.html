<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verdade ou Consequência</title>
    <link rel="stylesheet" type="text/css" href="assets/css/global.css" />
    <link rel="stylesheet" type="text/css" href="assets/css/rooms.css" />
</head>
<body>
    <div id="overlay">
        <div id="areaJogadores" >
           <header>
           <h2>Jogadores</h2>
           <div id="AreaAdicionarJogador">
             <input type="text" id="nomedojogador" placeholder="adicione o nome de jogador" >
             <button id="adicionarJogador">+</button>
           </div>
           </header>

           <div id="listaDeJogadores">
                <template id="item-template-jogador">
                    <span class="itemListaPlayer">
                    <p class="nomedojogadorLista"></p>
                    <img src="assets/images/icons/remover-usuario branco.png" alt="" class="iconremoveplayer">      
                    </span>
                </template>
                
           </div>
           
           <button id="btn-start">COMEÇAR JOGO</button>
        </div>
   </div>
    
<main>
    <div id="turno-display" style="display: none;">DESAFIO PARA: <strong id="nome-jogador">---</strong></div>

    <div class="game-scene" id="main-game" style="display: none;">
        <div class="deck-pile"><span>TOQUE PARA SACAR</span></div>
        <div id="card-wrapper" class="card-wrapper">
            <div class="card-face card-back"></div>
            <div id="face-front" class="card-face card-front">
                <div id="texto-desafio" class="texto-desafio"></div>
                <div class="drinks-container">
                    <div class="drink-icon"><div class="drink-fill"></div></div>
                    <div class="drink-icon"><div class="drink-fill"></div></div>
                    <div class="drink-icon"><div class="drink-fill"></div></div>
                </div>
                <div class="footer-line"></div>
            </div>
        </div>
    </div>
</main>
    
    <script src="assets/js/rooms.js"></script>

</body>
</html>
